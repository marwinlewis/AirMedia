[package]
name = "airmedia"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight modern GPU-accelerated media player written in Rust"

[dependencies]
eframe = { version = "0.37.0", default-features = true }
cpal = "0.18.2"
rfd = "0.17.2"
crossbeam-channel = "0.5.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.13"
ringbuf = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
