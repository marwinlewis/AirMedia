[package]
name = "airmedia"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight modern GPU-accelerated media player written in Rust"
authors = ["AirMedia Open Source Media Player <https://github.com/marwinlewis/airmedia>"]
repository = "https://github.com/marwinlewis/airmedia"
homepage = "https://github.com/marwinlewis/airmedia"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "airmedia"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.13"
ringbuf = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = true }
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
