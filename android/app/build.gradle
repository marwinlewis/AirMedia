plugins {
    id 'com.android.application'
}

android {
    namespace 'io.airmedia.player'
    compileSdk 34

    defaultConfig {
        applicationId "io.airmedia.player"
        minSdk 26 // AAudio (used by cpal) requires API 26+; keep in sync with cargo ndk --platform
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // Fallback signing for portable release builds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // AirMedia uses NativeActivity with zero Java runtime overhead
}
