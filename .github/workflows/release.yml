name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (uncheck to build & upload workflow artifacts only)'
        type: boolean
        default: true
      tag_name:
        description: 'Release tag (e.g. v0.1.0). If blank, uses pushed tag or Cargo.toml version.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- FFmpeg Setup (Enables media decoding and integration testing) ---
      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      # --- Linux Setup & Build ---
      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            ffmpeg

      - name: Build and Package (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          chmod +x ./scripts/build_unix.sh
          ./scripts/build_unix.sh

      # --- macOS Build (ARM64 + Intel x64 + Universal App & DMG) ---
      - name: Build and Package (macOS)
        if: matrix.platform.os == 'macos-latest'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x ./scripts/build_macos.sh
          ./scripts/build_macos.sh

      # --- Windows Build (x64 Inno Setup Installer & Portable ZIP) ---
      - name: Install Inno Setup
        if: matrix.platform.os == 'windows-latest'
        run: choco install innosetup --no-progress

      - name: Build and Package (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        env:
          # Base64 of the .pfx file; the runner has no access to a local certificate path.
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "airmedia-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $env:WINDOWS_CERTIFICATE_PATH = $pfx
          }
          .\scripts\build_windows.ps1
          if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      # --- Upload Artifacts for Workflow Run ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build and Package (Android APK)
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd dist
          echo "=== Downloaded Artifacts ==="
          ls -la
          cat *.sha256 > SHA256SUMS.txt || true
          sort -u SHA256SUMS.txt -o SHA256SUMS.txt
          echo "=== Consolidated Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag & Title
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=AirMedia ${TAG}" >> $GITHUB_ENV

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.apk
            dist/*.sha256
            dist/SHA256SUMS.txt
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
