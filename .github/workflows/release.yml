name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (uncheck to build & upload workflow artifacts only)'
        type: boolean
        default: true
      tag_name:
        description: 'Release tag (e.g. v0.1.0). If blank, uses pushed tag or Cargo.toml version.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

# Build jobs (including pull_request runs) only need to read the repo; the release job
# below is the only one granted write access.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # --- FFmpeg Setup (Enables media decoding and integration testing) ---
      - name: Set up FFmpeg (Windows & Linux)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

      # --- Linux Setup & Build ---
      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            ffmpeg

      - name: Build and Package (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          chmod +x ./scripts/build_unix.sh
          ./scripts/build_unix.sh

      # --- macOS Build (ARM64 + Intel x64 + Universal App & DMG) ---
      - name: Build and Package (macOS)
        if: matrix.platform.os == 'macos-latest'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x ./scripts/build_macos.sh
          ./scripts/build_macos.sh

      # --- Windows Build (x64 Inno Setup Installer & Portable ZIP) ---
      - name: Install Inno Setup
        if: matrix.platform.os == 'windows-latest'
        run: choco install innosetup --no-progress

      - name: Build and Package (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        env:
          # Base64 of the .pfx file; the runner has no access to a local certificate path.
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "airmedia-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $env:WINDOWS_CERTIFICATE_PATH = $pfx
          }
          .\scripts\build_windows.ps1
          if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      # --- Upload Artifacts for Workflow Run ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # build_android.sh runs `cargo run --example generate_assets` on the host first, which
      # compiles the crate for x86_64-linux (cpal -> alsa-sys etc.), so host system libs are needed.
      - name: Install Linux host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build and Package (Android APK)
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd dist
          echo "=== Downloaded Artifacts ==="
          ls -la
          cat *.sha256 > SHA256SUMS.txt || true
          sort -u SHA256SUMS.txt -o SHA256SUMS.txt
          echo "=== Consolidated Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag & Title
        env:
          # Passed through the environment, never interpolated into the script, so a crafted
          # tag name cannot inject shell commands.
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid release tag '${TAG}' (expected e.g. v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=AirMedia ${TAG}" >> $GITHUB_ENV

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.apk
            dist/*.sha256
            dist/SHA256SUMS.txt
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
