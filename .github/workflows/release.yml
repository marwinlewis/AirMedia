name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (uncheck to build & upload workflow artifacts only)'
        type: boolean
        default: true
      tag_name:
        description: 'Release tag (e.g. v0.1.0). If blank, uses pushed tag or Cargo.toml version.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- Linux Setup & Build ---
      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            ffmpeg

      - name: Build and Package (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          chmod +x ./scripts/build_unix.sh
          ./scripts/build_unix.sh

      # --- macOS Build (ARM64 + Intel x64 + Universal) ---
      - name: Build and Package (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: |
          chmod +x ./scripts/build_macos.sh
          ./scripts/build_macos.sh

      # --- Windows Build (x64) ---
      - name: Build and Package (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1

      # --- Upload Artifacts for Workflow Run ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd dist
          echo "=== Downloaded Artifacts ==="
          ls -la
          cat *.sha256 > SHA256SUMS.txt || true
          sort -u SHA256SUMS.txt -o SHA256SUMS.txt
          echo "=== Consolidated Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag & Title
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=AirMedia ${TAG}" >> $GITHUB_ENV

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS.txt
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
